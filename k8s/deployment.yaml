apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: __NAMESPACE__
  labels:
    app: app
spec:
  replicas: __REPLICAS__
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: __IMAGE__
          ports:
            - containerPort: __PORT__
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: __PORT__}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: __PORT__}
            initialDelaySeconds: 15
