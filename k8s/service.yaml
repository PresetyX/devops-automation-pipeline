apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: __NAMESPACE__
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: __PORT__
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
  namespace: __NAMESPACE__
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
