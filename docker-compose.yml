services:
  app:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      retries: 3
  automation:
    build: .
    command: ["health"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./backups:/app/backups
